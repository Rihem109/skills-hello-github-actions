name: Post welcome message
on:
  pull_request: 
    types: [opened]
  permissions:
    pull-requests: write
  jobs:
    name: Post welcome message
    runs-on: ubuntu-latest
    steps:
        - run: gh pr comment "$PR_URL" --body "Welcome to the repository! "
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            PR_URL: ${{ github.event.pull_request.url }}